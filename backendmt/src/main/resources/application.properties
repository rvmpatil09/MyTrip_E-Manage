spring.application.name=backendmt

# MySQL Connection
# MySQL Connection defaults
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Database Configuration (Host port is 3307)
spring.datasource.url=jdbc:mysql://localhost:3306/my_trip_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root



# Multipart configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Secret
jwt.secret=${JWT_SECRET:MyTripSecretKeyForJwtAuthenticationWhichIsVeryLongAndSecure2026!}

# Twilio Configuration
twilio.account.sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth.token=YOUR_TWILIO_AUTH_TOKEN
twilio.phone.number=+1234567890
# For WhatsApp, Twilio provides a sandbox number like: whatsapp:+14155238886
twilio.whatsapp.number=whatsapp:+14155238886

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=trip-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Fail fast on consumer / admin connection attempts
spring.kafka.properties.request.timeout.ms=3000
spring.kafka.properties.default.api.timeout.ms=3000
spring.kafka.properties.max.block.ms=3000

# Do not block application startup waiting for partitions
spring.kafka.listener.immediate-stop=true

# Disable Kafka Admin from checking the broker to create topics at startup
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false

spring.kafka.listener.auto-startup=false