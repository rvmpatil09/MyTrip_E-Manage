version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mytrip-mysql
    restart: always
    environment:
      MYSQL_DATABASE: my_trip_db
      MYSQL_USER: ${DB_USER:-mytrip_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mytrip_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mytrip-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backendmt
      dockerfile: Dockerfile
    container_name: mytrip-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: my_trip_db
      DB_USER: ${DB_USER:-mytrip_user}
      DB_PASSWORD: ${DB_PASSWORD:-mytrip_secret}
      JWT_SECRET: ${JWT_SECRET:-MyTripSecretKeyForJwtAuthenticationWhichIsVeryLongAndSecure2026!}
    volumes:
      - receipt_uploads:/app/uploads
    networks:
      - mytrip-network

  frontend:
    build:
      context: ./frontendmt
      dockerfile: Dockerfile
    container_name: mytrip-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mytrip-network

volumes:
  mysql_data:
  receipt_uploads:

networks:
  mytrip-network:
    driver: bridge