services:
  mysql:
    image: mysql:8.0
    container_name: mytrip-mysql
    restart: always
    environment:
      MYSQL_DATABASE: my_trip_db
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mytrip-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: rvprodocker/mytrip-backend:latest
    container_name: mytrip-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/my_trip_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root_secret"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQLDialect"
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"
      SERVER_PORT: "8080"
    volumes:
      - receipt_uploads:/app/uploads
    networks:
      - mytrip-network

  frontend:
    image: rvprodocker/mytrip-frontend:latest
    container_name: mytrip-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mytrip-network

volumes:
  mysql_data:
  receipt_uploads:

networks:
  mytrip-network:
    driver: bridge

kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL    