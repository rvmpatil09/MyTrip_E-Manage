name: Mytrip-E-Manage Release Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Build & Verify Backend and Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Backend Build (JDK 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Spring Boot Backend
        run: |
          cd backendmt
          mvn clean package -DskipTests

      # 2. Frontend Build
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontendmt/package-lock.json

      - name: Install & Build React Frontend
        run: |
          cd frontendmt
          npm ci
          npm run build

  build-and-push-docker:
    name: Build & Push Docker Images
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Sanitize username by stripping any accidental whitespace or newlines
      - name: Set Clean Docker Hub Username
        id: prep
        run: |
          CLEAN_USER=$(echo -n "${{ secrets.DOCKERHUB_USERNAME }}" | tr -d '[:space:]')
          echo "username=$CLEAN_USER" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.prep.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backendmt
          push: true
          tags: |
            ${{ steps.prep.outputs.username }}/mytrip-backend:latest
            ${{ steps.prep.outputs.username }}/mytrip-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontendmt
          push: true
          tags: |
            ${{ steps.prep.outputs.username }}/mytrip-frontend:latest
            ${{ steps.prep.outputs.username }}/mytrip-frontend:${{ github.sha }}