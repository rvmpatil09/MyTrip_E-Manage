name: Mytrip-E-Manage Release Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Build & Verify Backend and Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Backend Build (JDK 21)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Spring Boot Backend
        run: |
          cd backendmt
          mvn clean package -DskipTests

      # 2. Frontend Build
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontendmt/package-lock.json

      - name: Install & Build React Frontend
        run: |
          cd frontendmt
          npm ci
          npm run build

  build-and-push-docker:
    name: Build & Push Docker Images
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
            echo "DOCKER_AUTH=true" >> $GITHUB_ENV
          else
            echo "Docker Hub credentials missing. Skipping registry push."
            echo "DOCKER_AUTH=false" >> $GITHUB_ENV
          fi

      - name: Build & Push Backend Image
        run: |
          if [ "$DOCKER_AUTH" = "true" ]; then
            docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/mytrip-backend:latest" -t "${{ secrets.DOCKERHUB_USERNAME }}/mytrip-backend:${{ github.sha }}" ./backendmt
            docker push "${{ secrets.DOCKERHUB_USERNAME }}/mytrip-backend:latest"
            docker push "${{ secrets.DOCKERHUB_USERNAME }}/mytrip-backend:${{ github.sha }}"
          else
            echo "Skipping backend image push."
          fi

      - name: Build & Push Frontend Image
        run: |
          if [ "$DOCKER_AUTH" = "true" ]; then
            docker build -t "${{ secrets.DOCKERHUB_USERNAME }}/mytrip-frontend:latest" -t "${{ secrets.DOCKERHUB_USERNAME }}/mytrip-frontend:${{ github.sha }}" ./frontendmt
            docker push "${{ secrets.DOCKERHUB_USERNAME }}/mytrip-frontend:latest"
            docker push "${{ secrets.DOCKERHUB_USERNAME }}/mytrip-frontend:${{ github.sha }}"
          else
            echo "Skipping frontend image push."
          fi