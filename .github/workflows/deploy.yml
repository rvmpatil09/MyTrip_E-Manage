name: Mytrip-E-Manage Release Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Build & Verify Backend and Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Backend Build
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Spring Boot Backend (Skip Tests on CI)
        run: |
          cd backendmt
          mvn clean package -DskipTests

      # 2. Frontend Build
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontendmt/package-lock.json

      - name: Install & Build React Frontend
        run: |
          cd frontendmt
          npm ci
          npm run build

  build-and-push-docker:
    name: Build & Push Docker Images
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: ./backendmt
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mytrip-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mytrip-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: ./frontendmt
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mytrip-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mytrip-frontend:${{ github.sha }}